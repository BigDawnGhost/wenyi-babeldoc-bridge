name: Publish bridge to PyPI
run-name: PyPI · ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to validate (required for uploads)
        type: string
        default: ""
      publish:
        description: Upload only after verifying an existing public GitHub release
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-pypi.yml
      - .gitattributes
      - .git_archival.txt
      - pyproject.toml
      - setup.cfg
      - setup.py
      - MANIFEST.in
      - rust/**
      - README.md
      - LICENSE
      - NATIVE_NOTICES.md
      - THIRD_PARTY.md
      - scripts/native_materials.py
      - scripts/babeldoc_rust_probe/generate_loader.py
      - scripts/check_installed_distribution.py
      - src/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Validate release identity
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --isolated --no-project --python 3.12 --with setuptools-scm python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from packaging.version import Version
          from setuptools_scm import get_version

          for key in os.environ:
              if key.startswith(("SETUPTOOLS_SCM_PRETEND_", "HATCH_VCS_PRETEND_")):
                  raise SystemExit(f"Version override is not allowed: {key}")
          tag = os.environ["RELEASE_TAG"]
          if tag:
              if tag.startswith("-"):
                  raise SystemExit("Invalid release tag")
              def git(*arguments):
                  return subprocess.check_output(["git", *arguments], text=True).strip()
              if git("rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}") != git("rev-parse", "HEAD"):
                  raise SystemExit("Release tag does not point at the checkout")
              if git("status", "--porcelain", "--untracked-files=no"):
                  raise SystemExit("Release builds require a clean checkout")
          version = Version(get_version(root="."))
          if tag:
              if version.is_devrelease or version.local:
                  raise SystemExit("PyPI releases must not use development/local versions")
              if Version(tag.removeprefix("v")) != version:
                  raise SystemExit("Release tag and setuptools-scm version disagree")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"python={version}\n")
          PY
      - name: Verify public release before upload
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          if not tag:
              raise SystemExit("Uploads require an explicit release tag")
          release = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/releases/tags/{tag}"], text=True,
          ))
          if release["draft"] or release["tag_name"] != tag:
              raise SystemExit("Uploads require the matching public GitHub release")
          PY
      - name: Check release contracts
        run: |
          # This environment does not install the runtime or compile the native code.
          uv run --isolated --no-project --python 3.12 --with pyyaml --with setuptools-scm \
            python -m unittest tests/test_desktop_workflow.py tests/test_pypi_workflow.py \
              tests/test_package_version.py tests/test_native_build.py
      - name: Build bridge distributions
        run: |
          uv build --sdist --no-sources --out-dir dist/pypi
          uvx --from twine twine check --strict dist/pypi/*
      - name: Smoke test the source distribution
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.python }}
        run: |
          set -eu
          smoke=$(mktemp -d "$RUNNER_TEMP/bridge-pypi-sdist.XXXXXX")
          python="$smoke/venv/bin/python"
          uv venv "$smoke/venv" --python 3.12
          uv pip install --python "$python" dist/pypi/*.tar.gz httpx
          uv pip check --python "$python"
          cp -R tests scripts/check_installed_distribution.py "$smoke"
          cd "$smoke"
          "$python" -I check_installed_distribution.py --expected-version "$EXPECTED_VERSION" \
            tests test_schema test_session_snapshot test_session_cleanup test_babeldoc_parser \
            test_desktop_runtime test_babeldoc_integration test_native
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/pypi/
          if-no-files-found: error
          retention-days: 14

  wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: windows-2022
            arch: AMD64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pypa/cibuildwheel@v3.3
        env:
          CIBW_BUILD: cp310-*
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET="13.0"'
          CIBW_TEST_REQUIRES: httpx
          CIBW_TEST_SOURCES: tests/test_native.py tests/test_schema.py scripts/check_installed_distribution.py
          CIBW_TEST_COMMAND: >-
            python -I scripts/check_installed_distribution.py tests test_native test_schema
          CARGO_BUILD_JOBS: "4"
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.repository == 'BigDawnGhost/wenyi-babeldoc-bridge'
    needs: [build, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wenyi-babeldoc-bridge/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-*
          merge-multiple: true
          path: dist/pypi/
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Publish bridge
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/pypi/*
