name: Publish bridge to PyPI
run-name: PyPI · ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to validate (required for uploads)
        type: string
        default: ""
      publish:
        description: Upload only after verifying an existing public GitHub release
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-pypi.yml
      - .gitattributes
      - .git_archival.txt
      - pyproject.toml
      - README.md
      - LICENSE
      - src/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Validate release identity
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --isolated --no-project --python 3.12 --with hatch-vcs python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from packaging.version import Version
          from setuptools_scm import get_version

          for key in os.environ:
              if key.startswith(("SETUPTOOLS_SCM_PRETEND_", "HATCH_VCS_PRETEND_")):
                  raise SystemExit(f"Version override is not allowed: {key}")
          tag = os.environ["RELEASE_TAG"]
          if tag:
              if tag.startswith("-"):
                  raise SystemExit("Invalid release tag")
              def git(*arguments):
                  return subprocess.check_output(["git", *arguments], text=True).strip()
              if git("rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}") != git("rev-parse", "HEAD"):
                  raise SystemExit("Release tag does not point at the checkout")
              if git("status", "--porcelain", "--untracked-files=no"):
                  raise SystemExit("Release builds require a clean checkout")
          version = Version(get_version(root="."))
          if tag:
              if version.is_devrelease or version.local:
                  raise SystemExit("PyPI releases must not use development/local versions")
              if Version(tag.removeprefix("v")) != version:
                  raise SystemExit("Release tag and hatch-vcs version disagree")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"python={version}\n")
          PY
      - name: Verify public release before upload
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          tag = os.environ["RELEASE_TAG"]
          if not tag:
              raise SystemExit("Uploads require an explicit release tag")
          release = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/releases/tags/{tag}"], text=True,
          ))
          if release["draft"] or release["tag_name"] != tag:
              raise SystemExit("Uploads require the matching public GitHub release")
          PY
      - name: Check release contracts
        run: |
          uv run --isolated --no-project --python 3.12 --with pyyaml --with hatch-vcs \
            python -m unittest discover -s tests -p 'test_*.py'
      - name: Build bridge distributions
        run: |
          uv build --no-sources --out-dir dist/pypi
          uvx --from twine twine check --strict dist/pypi/*
      - name: Smoke test wheels and source distributions
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.python }}
          WENYI_BABELDOC_INTEGRATION: "0"
        run: |
          set -eu
          distributions="$PWD/dist/pypi"
          for extension in whl tar.gz; do
            environment="$RUNNER_TEMP/bridge-pypi-$extension"
            uv venv "$environment" --python 3.12
            uv pip install --python "$environment/bin/python" "$distributions"/*."$extension" httpx
            uv pip check --python "$environment/bin/python"
            "$environment/bin/python" -I - <<'PY'
          import os
          import tempfile
          import unittest
          from importlib.metadata import distribution

          installed = distribution("wenyi-babeldoc-bridge")
          if installed.version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"Unexpected bridge version: {installed.version}")
          entry = next(item for item in installed.entry_points if item.name == "wenyi-babeldoc-bridge")
          with tempfile.TemporaryDirectory() as state:
              os.environ["WENYI_BABELDOC_STATE_DIR"] = state
              from fastapi.testclient import TestClient
              from wenyi_babeldoc_bridge import server

              if not callable(entry.load()):
                  raise SystemExit("Bridge console entry point is not callable")
              if server.app.version != installed.version:
                  raise SystemExit("Bridge API and installed package versions disagree")
              with TestClient(server.app) as client:
                  response = client.get("/health")
                  if response.status_code != 200 or response.json()["ok"] is not True:
                      raise SystemExit(f"Bridge health check failed: {response.text}")
              # Build-tool tests need the checkout's scripts and run in Desktop CI.
              # These runtime tests must pass with only the installed distribution.
              suite = unittest.defaultTestLoader.loadTestsFromNames([
                  f"wenyi_babeldoc_bridge.{name}" for name in (
                      "test_schema", "test_session_snapshot", "test_session_cleanup",
                      "test_babeldoc_parser", "test_desktop_runtime",
                      "test_babeldoc_integration",
                  )
              ])
              if suite.countTestCases() == 0:
                  raise SystemExit("No installed bridge regression tests found")
              if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
                  raise SystemExit("Installed bridge regression tests failed")
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/pypi/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.repository == 'BigDawnGhost/wenyi-babeldoc-bridge'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/wenyi-babeldoc-bridge/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/pypi/
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
      - name: Publish bridge
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/pypi/*
