name: Publish verified desktop plugin
on:
  push:
    branches: ["publish/desktop-plugin-*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: BigDawnGhost/wenyi-babeldoc-bridge
      PLUGIN_VERSION: "0.1.1"
      PLUGIN_BUILD_RUN: "41218680111"
      PLUGIN_BUILD_SHA: e0885491f1a2378979a5184ff013bcc6facad478
    steps:
      - uses: actions/checkout@v4
      - name: Publish the complete verified artifact with gh
        run: python scripts/publish_desktop.py
