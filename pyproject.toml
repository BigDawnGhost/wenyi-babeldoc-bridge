[project]
name = "wenyi-babeldoc-bridge"
version = "0.1.0"
description = "AGPL BabelDOC HTTP bridge for Wenyi (extract paragraphs / fillback PDF)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "babeldoc>=0.5.20,<0.6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf<1.25.3",
]

[project.scripts]
wenyi-babeldoc-bridge = "wenyi_babeldoc_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wenyi_babeldoc_bridge"]
