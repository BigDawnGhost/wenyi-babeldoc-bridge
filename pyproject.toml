[project]
name = "wenyi-babeldoc-bridge"
dynamic = ["version"]
description = "AGPL BabelDOC HTTP bridge for Wenyi (extract paragraphs / fillback PDF)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "babeldoc>=0.6.2,<0.7.0",
    "bitstring>=4.3.0,<5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf<2",
]

[project.scripts]
wenyi-babeldoc-bridge = "wenyi_babeldoc_bridge.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/wenyi_babeldoc_bridge"]
