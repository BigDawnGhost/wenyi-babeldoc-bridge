[project]
name = "wenyi-babeldoc-bridge"
dynamic = ["version"]
description = "AGPL BabelDOC HTTP bridge for Wenyi (extract paragraphs / fillback PDF)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NATIVE_NOTICES.md", "THIRD_PARTY.md"]
dependencies = [
    "babeldoc==0.7.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.26.7,<2",
]

[project.scripts]
wenyi-babeldoc-bridge = "wenyi_babeldoc_bridge.server:main"

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "setuptools-rust>=1.11", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wenyi_babeldoc_bridge = ["fixtures/**/*"]

[[tool.setuptools-rust.ext-modules]]
target = "wenyi_babeldoc_bridge._native"
path = "rust/Cargo.toml"
binding = "PyO3"
py-limited-api = true
debug = false
args = ["--locked"]
